[package]
name = "tauri-plugin-admob"
version = "0.1.0"
description = "Minimal AdMob (Google Mobile Ads) plugin for the MemoryCard Android app: banner + interstitial, UMP consent"
edition = "2021"
publish = false
# links + tauri-plugin's build script expose android/ to the app (tauri.settings.gradle is generated from it)
links = "tauri-plugin-admob"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
