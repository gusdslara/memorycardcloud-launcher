"$schema" = "schemas/schema.json"

[default]
description = "Allows the app to initialize AdMob, show/hide the banner and load/show interstitials (Android only; no-ops elsewhere)."
permissions = [
  "allow-initialize",
  "allow-show-banner",
  "allow-hide-banner",
  "allow-load-interstitial",
  "allow-show-interstitial",
]
