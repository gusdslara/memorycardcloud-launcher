[package]
name = "tauri-plugin-web-tab"
version = "0.1.0"
description = "Opens a page in an in-app browser tab (Chrome Custom Tab) on Android: for web ports that need cross-origin isolation, which the Android WebView does not offer"
edition = "2021"
publish = false
# links + tauri-plugin's build script expose android/ to the app (tauri.settings.gradle is generated from it)
links = "tauri-plugin-web-tab"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
