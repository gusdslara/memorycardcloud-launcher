[package]
name = "tauri-plugin-apk-installer"
version = "0.1.0"
description = "Installs downloaded APKs from inside the MemoryCard Android app (PackageInstaller session), opens and uninstalls them"
edition = "2021"
publish = false
# links + tauri-plugin's build script expose android/ to the app (tauri.settings.gradle is generated from it)
links = "tauri-plugin-apk-installer"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
